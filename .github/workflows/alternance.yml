name: Veille alternance finance (LinkedIn)

on:
  schedule:
    - cron: '17 */3 * * *'      # toutes les 3 h ; la fenetre reste "24 h glissantes"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veille-alternance
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Executer le bot
        shell: pwsh
        continue-on-error: true      # LinkedIn peut bloquer l'IP du runner : on ne casse pas le workflow
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: pwsh -File ./alternance.ps1 -Quiet

      - name: Publier les resultats
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/latest.md data/latest.json data/seen.json 2>/dev/null || true
          git commit -m "Veille alternance $(date -u +'%Y-%m-%d %H:%M UTC')" || { echo "Rien a committer"; exit 0; }
          git push
