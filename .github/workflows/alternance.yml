name: Veille alternance finance

on:
  schedule:
    - cron: '7 * * * *'        # toutes les heures ; la fenetre reste "24 h glissantes"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veille-alternance
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Executer le bot
        shell: pwsh
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: pwsh -File ./alternance.ps1 -Quiet

      - name: Publier les resultats
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/latest.md data/latest.json data/seen.json
          git commit -m "Veille alternance $(date -u +'%Y-%m-%d %H:%M UTC')" || { echo "Rien a committer"; exit 0; }
          git push
